<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Reset your Hearthfolk password</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#141210; color:#f5f1ea; font-family:-apple-system, system-ui, sans-serif; padding:24px; }
  main { max-width:380px; width:100%; text-align:center; }
  h1 { font-size:22px; letter-spacing:6px; margin:0 0 8px; }
  p.sub { color:#a8a29e; font-size:14px; margin:0 0 24px; }
  form { display:flex; flex-direction:column; gap:12px; text-align:left; }
  label { font-size:13px; color:#a8a29e; display:flex; flex-direction:column; gap:6px; }
  input { padding:12px; border-radius:10px; border:1px solid #3a352f; background:#1f1c19; color:#f5f1ea; font-size:16px; }
  button { padding:13px; border-radius:10px; border:0; background:#e8e0d2; color:#141210;
           font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:#f0a3a3; font-size:13px; min-height:18px; margin:0; }
  .ok { color:#9fd6a4; font-size:14px; }
  .msg { font-size:14px; color:#a8a29e; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>HEARTHFOLK</h1>
  <p class="sub">Password reset</p>
  <p class="msg" id="status">Checking your reset link…</p>
  <form id="form" hidden>
    <label>New password
      <input type="password" id="pw" autocomplete="new-password" minlength="6" required />
    </label>
    <label>Confirm new password
      <input type="password" id="pw2" autocomplete="new-password" required />
    </label>
    <p class="err" id="err"></p>
    <button type="submit" id="btn">Set new password</button>
  </form>
  <p class="msg ok" id="done" hidden>Password updated. Return to the Hearthfolk app and sign in.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPABASE_URL = "https://igdkruzicljjqgmgbpsk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_rxOSCZf0v4eEufTeSayz5w_HdkCqf7T"; // substituted at deploy time; never commit a real key
  var status = document.getElementById("status");
  var form = document.getElementById("form");
  var done = document.getElementById("done");
  var err = document.getElementById("err");
  var params = new URLSearchParams(window.location.hash.slice(1));
  var qparams = new URLSearchParams(window.location.search);
  var error = params.get("error") || qparams.get("error");
  var errorCode = params.get("error_code") || qparams.get("error_code");
  function fail(msg) { status.textContent = msg; }
  if (error || errorCode === "otp_expired") {
    fail("This reset link is invalid or has expired. Go back to the app and request a new one.");
    return;
  }
  var type = params.get("type");
  if (type && type !== "recovery") {
    status.textContent = "You're confirmed. Return to the Hearthfolk app and sign in.";
    return;
  }
  var accessToken = params.get("access_token");
  var refreshToken = params.get("refresh_token");
  if (!accessToken) {
    fail("This page only works when opened from a Hearthfolk password-reset email.");
    return;
  }
  status.hidden = true;
  form.hidden = false;
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = "";
    var pw = document.getElementById("pw").value;
    var pw2 = document.getElementById("pw2").value;
    if (pw.length < 6) { err.textContent = "Use at least 6 characters."; return; }
    if (pw !== pw2) { err.textContent = "The passwords don't match."; return; }
    var btn = document.getElementById("btn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var s = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
      if (s.error) throw new Error("expired");
      var u = await sb.auth.updateUser({ password: pw });
      if (u.error) throw u.error;
      try { history.replaceState(null, "", window.location.pathname); } catch (e2) {}
      form.hidden = true; done.hidden = false;
    } catch (ex) {
      err.textContent = (ex && ex.message === "expired")
        ? "This link has expired. Request a new one from the app."
        : "Something went wrong. Please request a new link and try again.";
      btn.disabled = false; btn.textContent = "Set new password";
    }
  });
})();
</script>
</body>
</html>
